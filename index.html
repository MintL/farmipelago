<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#b9def1" />
  <title>Floating Farm Prototype</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #b9def1; font-family: system-ui, sans-serif; }
    body { touch-action: none; user-select: none; }
    canvas { display: block; width: 100%; height: 100%; }

    #hud { position: fixed; inset: 0; pointer-events: none; }
    #status {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%);
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      color: rgba(29,45,35,.9);
      font-weight: 750;
      font-size: 13px;
      box-shadow: 0 4px 14px rgba(0,0,0,.10);
      backdrop-filter: blur(5px);
      white-space: nowrap;
    }
    #regen {
      pointer-events: auto;
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      width: 42px; height: 42px;
      border: 0; border-radius: 50%;
      background: rgba(255,255,255,.78);
      box-shadow: 0 4px 14px rgba(0,0,0,.12);
      color: #294836;
      font-size: 24px; line-height: 42px;
    }

    #stickZone {
      pointer-events: auto;
      position: absolute;
      left: 0; bottom: 0;
      width: 58vw; height: 42vh;
      min-height: 190px;
    }
    #stickBase {
      position: absolute;
      left: max(24px, env(safe-area-inset-left));
      bottom: max(26px, env(safe-area-inset-bottom));
      width: 132px; height: 132px;
      border-radius: 50%;
      background: rgba(255,255,255,.24);
      border: 2px solid rgba(255,255,255,.45);
      box-shadow: inset 0 0 0 8px rgba(42,63,49,.05);
    }
    #stickKnob {
      position: absolute;
      left: 50%; top: 50%;
      width: 62px; height: 62px;
      margin: -31px;
      border-radius: 50%;
      background: rgba(255,255,255,.82);
      box-shadow: 0 5px 16px rgba(0,0,0,.18);
      transform: translate(0px,0px);
    }

    #jump {
      pointer-events: auto;
      position: absolute;
      right: max(24px, env(safe-area-inset-right));
      bottom: max(34px, env(safe-area-inset-bottom));
      width: 92px; height: 92px;
      border: 0; border-radius: 50%;
      background: rgba(255,247,220,.88);
      color: #6b3f22;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .06em;
      box-shadow: 0 8px 20px rgba(0,0,0,.18), inset 0 -5px 0 rgba(115,71,39,.14);
    }
    #jump:active { transform: translateY(2px) scale(.97); }

    #toast {
      position: absolute;
      left: 50%; top: 18%; transform: translate(-50%,-50%) scale(.92);
      opacity: 0;
      padding: 9px 14px;
      border-radius: 12px;
      background: rgba(47,38,30,.82);
      color: white;
      font-weight: 800;
      transition: opacity .15s, transform .15s;
    }
    #toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

    @media (min-width: 700px) {
      #stickBase { width: 150px; height: 150px; }
      #jump { width: 104px; height: 104px; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="status">0 tiles ploughed</div>
    <button id="regen" aria-label="Generate a new farm">↻</button>
    <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
    <button id="jump">JUMP</button>
    <div id="toast"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
