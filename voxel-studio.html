<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#e8dec4" />
  <link rel="manifest" href="/voxel-studio.webmanifest" />
  <title>Farmipelago Voxel Studio</title>
  <link rel="stylesheet" href="./src/styles/voxel-studio.css" />
</head>
<body>
  <canvas id="renderCanvas" aria-hidden="true"></canvas>

  <main id="studio">
    <header class="topbar">
      <div class="titleWrap">
        <div class="eyebrow">Farmipelago</div>
        <h1>Voxel Studio</h1>
      </div>
      <div class="topActions">
        <button class="actionButton" id="importButton" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 17v3h14v-3"/></svg>
          Import
        </button>
      </div>
    </header>

    <section id="libraryScroll" aria-label="Voxel model library">
      <div id="modelGrid"></div>
      <div id="emptyState" hidden>
        <div><strong>No models</strong>Import an .fvox.json file to add one.</div>
      </div>
    </section>
  </main>

  <section id="detail" hidden aria-label="Model preview">
    <div id="detailHeader" class="topbar">
      <button class="iconButton" id="backButton" type="button" aria-label="Back">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
      </button>
      <div id="detailTitle"></div>
      <button class="actionButton" id="exportButton" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m0 0 4 4m-4-4L8 7"/><path d="M5 17v3h14v-3"/></svg>
        Export
      </button>
      <button class="iconButton dangerButton" id="deleteButton" type="button" aria-label="Delete model">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5"/></svg>
      </button>
    </div>
    <div id="detailStage">
      <div id="detailHint">Drag to rotate · pinch to zoom</div>
    </div>
  </section>

  <div id="rotateNotice" aria-live="polite">
    <div class="rotateCard">
      <svg class="rotateIcon icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z"/><path d="M5 3H3v5m0 0 3-3M19 21h2v-5m0 0-3 3"/></svg>
      <strong>Rotate to landscape</strong>
      <span>Voxel Studio is designed to use the full width of a phone.</span>
    </div>
  </div>

  <input id="fileInput" type="file" accept=".json,.fvox.json,application/json" multiple />
  <script type="module" src="./src/voxel-studio/main.js"></script>
</body>
</html>
